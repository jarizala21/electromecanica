<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Electromecánica</title>
<meta name="description" content="Simulaciones interactivas de electricidad y neumática para clase.">
<meta name="theme-color" content="#e6e9eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/favicon.svg" type="image/svg+xml">
<link rel="icon" href="iconos/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Electromecánica">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<div id="app" class="page">
  <header class="mast">
    <a class="brand" href="#">
      <span class="mark" id="mark"></span>
      <span>
        <h1 class="wordmark">Electromecánica</h1>
        <span class="tagline">Simulaciones interactivas para clase</span>
      </span>
    </a>
    <button type="button" class="instalar" id="instalar" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      Instalar app
    </button>
  </header>

  <div class="aviso" id="aviso-ios" role="note" hidden>
    <p><strong>Para instalarla en el iPhone o iPad:</strong> en Safari, pulsa
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11v9h12v-9"/></svg>
      <em>Compartir</em> y elige <em>Añadir a pantalla de inicio</em>.</p>
    <button type="button" class="cerrar" id="cerrar-ios" aria-label="Cerrar aviso">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <section id="vista-inicio" class="vista">
    <div class="tools">
      <label class="search" for="buscar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="buscar" type="search" placeholder="Buscar simulación" autocomplete="off" spellcheck="false" aria-label="Buscar simulación">
      </label>
      <a class="continuar" id="continuar" href="#" hidden>
        <span class="k">Última abierta</span><strong id="continuar-t"></strong>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
    <div class="tiles" id="secciones"></div>
    <div class="vista" id="resultados" hidden></div>
    <p class="meta" id="meta"></p>
  </section>

  <section id="vista-seccion" class="vista" hidden>
    <a class="crumb" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Inicio
    </a>
    <header class="sec-head">
      <span class="glyph glyph-lg" id="sec-glyph"></span>
      <div class="sec-text"><h2 id="sec-nombre" tabindex="-1"></h2><p id="sec-desc"></p></div>
      <span class="count" id="sec-count"></span>
    </header>
    <div class="cards" id="sec-cards"></div>
  </section>
</div>

<div id="visor" class="visor" hidden>
  <header class="vbar">
    <a class="vbtn back" id="v-back" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span class="back-label" id="v-back-label"></span>
    </a>
    <div class="vtitle"><span class="vpos"><span class="vpos-sec" id="v-sec"></span><span id="v-pos"></span></span><span class="vname" id="v-name"></span></div>
    <div class="vactions">
      <button type="button" class="vbtn icon" id="v-prev" aria-label="Simulación anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button type="button" class="vbtn icon" id="v-next" aria-label="Simulación siguiente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button type="button" class="vbtn icon" id="v-reload" aria-label="Reiniciar la simulación" title="Reiniciar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
      </button>
      <button type="button" class="vbtn icon" id="v-full" aria-label="Pantalla completa" title="Pantalla completa" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>
  <div class="stage" id="stage">
    <iframe id="frame" title="Simulación" allow="fullscreen"></iframe>
    <div class="loading" id="loading"><span class="spinner"></span>Cargando simulación…</div>
  </div>
</div>

<script src="catalogo.js"></script>
<script src="app.js"></script>
</body>
</html>
