# Publica la app en GitHub Pages cada vez que se guarda un cambio en la rama main.
name: Publicar la app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Instalar el generador de iconos
        run: npm install --no-save --no-audit --no-fund @resvg/resvg-js@2.6.2

      - name: Preparar la web (índice de simulaciones, versión e iconos)
        run: node herramientas/preparar.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v5
